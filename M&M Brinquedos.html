<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>M&amp;M Brinquedos</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap"><style id="css">/* Layout: faixas horizontais de céu e papel, cortadas por bordas de nuvem; cards fofos como infláveis, relevo sólido azul-noite. Tema único (dia ensolarado), por escolha. */
:root{
  --ceu:#E6F1FF; --papel:#FFFCF5; --branco:#FFFFFF; --linha:#D5E0F2;
  --ink:#0A2A6E; --ink-suave:#4A5A85; --sombra:rgba(10,42,110,.18); --veu:rgba(10,42,110,.5);
  --azul:#0B4FA8; --azul-soft:#DCE8FF; --vermelho:#C8261F; --vermelho-soft:#FFE2DE;
  --amarelo:#FFC81A; --amarelo-soft:#FFF3C4; --verde:#23AC53; --laranja:#FF9514;
  --rosa:#D11F7E; --ceu-vidro:rgba(230,241,255,.62); --branco-vidro:rgba(255,255,255,.86); --roxo:#3A2C8C; --whats:#25D366; --on:#FFFFFF;
  --f-display:"Fredoka","Baloo 2",system-ui,sans-serif;
  --f-corpo:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-faixa:"Barlow Condensed","Arial Narrow",sans-serif;
  --r-sm:8px; --r-md:16px; --r-lg:28px; --r-pill:999px;
  --relevo-sm:0 3px 0 var(--ink); --relevo:0 5px 0 var(--ink); --flutuar:0 14px 30px var(--sombra);
  --mola:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--ink);font-family:var(--f-corpo);font-size:17px;line-height:1.55;font-weight:500;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:20px}
.svg-i{width:22px;height:22px;fill:currentColor;flex:none}

/* ---------- logo ---------- */
.logo{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-weight:700;line-height:.9;text-decoration:none}
.logo .l-mm{font-size:34px;letter-spacing:-.01em}
.logo .l-br{font-size:13.5px;letter-spacing:.03em;margin-top:2px}
.logo span span{color:var(--c);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.logo .l-barra{width:92%;height:5px;border-radius:var(--r-pill);background:var(--amarelo);box-shadow:var(--relevo-sm);margin-top:5px}
.logo:hover .l-mm span{animation:pulo .5s var(--mola)}
.logo:hover .l-mm span:nth-child(2){animation-delay:.06s}.logo:hover .l-mm span:nth-child(3){animation-delay:.12s}
@keyframes pulo{40%{transform:translateY(-6px)}}
.l-mm span,.l-br span{display:inline-block}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 26px;border-radius:var(--r-pill);border:2px solid var(--ink);font-family:var(--f-corpo);font-weight:800;font-size:17px;line-height:1;text-decoration:none;cursor:pointer;box-shadow:var(--relevo);transition:transform .18s var(--mola),box-shadow .18s var(--mola),background-color .2s;white-space:nowrap;position:relative;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink);transition-duration:.06s}
.btn:disabled{cursor:not-allowed;opacity:.55;transform:none;box-shadow:var(--relevo-sm)}
.btn-primario{background:var(--azul);color:var(--on)}
.btn-destaque{background:var(--amarelo);color:var(--ink)}
.btn-whats{background:var(--whats);color:var(--ink)}
.btn-contorno{background:var(--branco);color:var(--ink)}
.btn-perigo{background:var(--vermelho);color:var(--on)}
.btn-sm{height:42px;padding:0 18px;font-size:15px;box-shadow:var(--relevo-sm)}
.btn-sm:hover{box-shadow:0 5px 0 var(--ink)}
.btn-sm:active{transform:translateY(3px)}
.btn-lg{height:62px;padding:0 32px;font-size:19px}
.btn .brilho{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.btn .brilho::after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:rgba(255,255,255,.45);transform:rotate(20deg);transition:left .55s ease}
.btn:hover .brilho::after{left:130%}
.btn-escolher[aria-pressed="true"]{background:var(--verde);color:var(--ink)}
.btn-escolher.pop{animation:pop .45s var(--mola)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}

/* ---------- faixas e títulos ---------- */
.faixa{display:inline-block;font-family:var(--f-faixa);font-weight:600;font-size:20px;line-height:24px;text-transform:uppercase;letter-spacing:.02em;padding:4px 12px;background:var(--bg,var(--vermelho));color:var(--fg,var(--on));border-radius:4px}
.faixa-pilula{border-radius:var(--r-pill);padding:8px 20px;border:2px solid var(--ink);font-family:var(--f-corpo);font-weight:800;font-size:15px;letter-spacing:.04em;box-shadow:var(--relevo-sm)}
.adesivo{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1;color:var(--c);
  text-shadow:3px 0 var(--branco),-3px 0 var(--branco),0 3px var(--branco),0 -3px var(--branco),2px 2px var(--branco),-2px -2px var(--branco),2px -2px var(--branco),-2px 2px var(--branco),0 7px 0 rgba(10,42,110,.35)}
.multicor span{display:inline-block;color:var(--c);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.multicor span{animation:quica 2.8s var(--mola) infinite;animation-delay:calc(var(--i) * .09s)}
@keyframes quica{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-10px) rotate(-3deg)}88%{transform:translateY(0)}}

/* ---------- nuvem ---------- */
.nuvem{display:block;width:100%;height:56px;margin-top:-56px;position:relative;z-index:1}
.nuvem .n-l{fill:var(--branco)} .nuvem .n-f{fill:var(--c)}

/* ---------- cabeçalho ---------- */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,252,245,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.topo.rolou{border-color:var(--linha);box-shadow:0 6px 20px rgba(10,42,110,.08)}
.topo .wrap{display:flex;align-items:center;gap:20px;padding-block:10px}
.topo nav{display:flex;gap:4px;margin-left:auto}
.topo nav a{font-weight:800;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:var(--r-pill);transition:background-color .2s,transform .2s var(--mola)}
.topo nav a:hover{background:var(--ceu);transform:translateY(-2px)}
.btn-pedido .contador{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:var(--r-pill);background:var(--vermelho);color:var(--on);font-size:13px;font-variant-numeric:tabular-nums}
.btn-pedido .contador.pula{animation:pop .5s var(--mola)}
@media (max-width:760px){.topo nav{display:none}.topo .acoes-topo{margin-left:auto}}
.acoes-topo{display:flex;gap:10px;align-items:center}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding-block:48px 96px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero{padding-block:28px 88px}}
.hero-txt{display:flex;flex-direction:column;gap:22px;align-items:flex-start;min-width:0}
.hero h1{font-size:clamp(40px,6.2vw,70px);line-height:1.02;letter-spacing:-.01em}
.hero h1 .multicor{white-space:nowrap}
.hero-lead{font-size:clamp(17px,1.6vw,20px);line-height:1.6;max-width:56ch;color:var(--ink-suave);font-weight:600}
.hero-lead strong{color:var(--ink)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px}
.entra{animation:entra .8s var(--mola) both;animation-delay:calc(var(--d,0) * .1s)}
@keyframes entra{from{transform:translateY(24px)}to{transform:none}}
.hero-foto{position:relative;min-width:0}
.hero-foto .moldura{position:relative;border-radius:40px;overflow:hidden;border:6px solid var(--branco);box-shadow:0 12px 0 var(--ink),var(--flutuar);transform:rotate(1.5deg);aspect-ratio:4/3.1;max-width:100%;background:var(--ceu)}
.hero-foto .moldura img{width:100%;height:100%;object-fit:cover;display:block}
.selo{position:absolute;left:-14px;bottom:-22px;width:132px;height:132px;border-radius:50%;background:var(--amarelo);border:4px solid var(--ink);box-shadow:var(--relevo);display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.05;padding:14px;transform:rotate(-10deg);animation:gira 9s ease-in-out infinite}
@keyframes gira{50%{transform:rotate(6deg) scale(1.04)}}
@media (max-width:520px){.selo{width:108px;height:108px;font-size:14px;left:-6px}}
.bola{position:absolute;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),inset 6px 6px 0 rgba(255,255,255,.35);animation:flutua var(--t,6s) ease-in-out infinite;animation-delay:var(--dl,0s);pointer-events:none}
@keyframes flutua{50%{transform:translateY(-18px) rotate(12deg)}}

/* qualidade */
.qualidade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:56px}
@media (max-width:980px){.qualidade{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.qualidade{grid-template-columns:1fr}}
.q-item{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-md);background:var(--branco);border:2px solid var(--linha);transition:transform .25s var(--mola),border-color .2s,box-shadow .25s}
.q-item:hover{transform:translateY(-4px) rotate(-.6deg);border-color:var(--ink);box-shadow:var(--relevo)}
.q-ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:var(--fg);border:2px solid var(--ink)}
.q-ic .svg-i{width:26px;height:26px}
.q-item h3{font-size:18px;line-height:1.2;margin-bottom:4px}
.q-item p{font-size:15px;line-height:1.45;color:var(--ink-suave)}
.atendemos{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:28px}
.atendemos > span{font-family:var(--f-faixa);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin-right:6px}
.seg{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 12px;border-radius:var(--r-pill);background:var(--bg);color:var(--fg);border:2px solid var(--ink);font-family:var(--f-display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.02em;box-shadow:var(--relevo-sm);transition:transform .2s var(--mola)}
.seg:hover{transform:translateY(-3px) rotate(-2deg)}

/* ---------- seções ---------- */
.secao{position:relative;padding-block:72px 96px}
.secao-ceu{background:var(--ceu-vidro)}
.secao-branca{background:var(--branco-vidro)}
.cab-secao{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.cab-secao > div{display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-width:0}
.cab-secao h2{font-size:clamp(32px,4.4vw,50px)}
.cab-secao p{color:var(--ink-suave);font-weight:600;max-width:58ch}

/* vitrine */
.grade-vitrine{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}
.card{display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;background:var(--bg);color:var(--fg);box-shadow:var(--flutuar);transition:transform .35s var(--mola),box-shadow .35s;border:3px solid var(--ink);will-change:transform}
.card:hover{transform:translateY(-8px) rotate(-.8deg);box-shadow:0 10px 0 var(--ink),var(--flutuar)}
.card:nth-child(even):hover{transform:translateY(-8px) rotate(.8deg)}
.card-foto{position:relative;aspect-ratio:16/11;background:var(--ceu);max-width:100%}
.card-foto img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .card-foto img{transform:scale(1.06)}
.card-foto .nuvem{position:absolute;left:0;right:0;bottom:-1px;margin:0;height:34px}
.sem-foto{width:100%;height:100%;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--ceu) 0 18px,var(--branco) 18px 36px);font-family:var(--f-display);font-weight:700;font-size:64px;color:var(--ink)}
.status-alugado{position:absolute;top:12px;right:12px;z-index:2;font-family:var(--f-faixa);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em;padding:4px 12px;border-radius:var(--r-pill);background:var(--ink);color:var(--amarelo);border:2px solid var(--amarelo);transform:rotate(4deg)}
.card.alugado .card-foto img{filter:saturate(.45)}
.card-corpo{padding:4px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;flex:1}
.card-corpo .faixa{font-size:16px;line-height:20px;margin-top:-4px}
.card-corpo .adesivo{font-size:30px}
.card-desc{font-weight:700;font-size:15.5px;line-height:1.45;flex:1}
.card-acoes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:4px}
.ver-mais{display:flex;justify-content:center;margin-top:44px}

/* catálogo */
.filtros{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.chip{height:40px;padding:0 16px;border-radius:var(--r-pill);border:2px solid var(--ink);background:var(--branco);font-weight:800;font-size:15px;cursor:pointer;transition:transform .2s var(--mola),background-color .2s,color .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on)}
.grade-catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.item{display:flex;flex-direction:column;border-radius:var(--r-md);background:var(--papel);border:2px solid var(--linha);overflow:hidden;transition:transform .3s var(--mola),border-color .2s,box-shadow .3s;animation:surge .45s var(--mola) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes surge{from{transform:scale(.92) translateY(12px)}to{transform:none}}
.item:hover{transform:translateY(-5px);border-color:var(--ink);box-shadow:var(--relevo)}
.item.escolhido{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde)}
.item .card-foto{aspect-ratio:16/10}
.item-corpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.item-cat{font-family:var(--f-faixa);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-suave)}
.item h3{font-size:21px}
.item p{font-size:14.5px;line-height:1.45;color:var(--ink-suave);flex:1}
.item .card-acoes{justify-content:flex-start;margin-top:8px}
.vazio{padding:40px;text-align:center;border:2px dashed var(--linha);border-radius:var(--r-md);color:var(--ink-suave);font-weight:700}

/* contato */
.contato{background:var(--ink);color:var(--on);padding-block:72px 64px}
.contato .cab-secao p{color:#C9D6F2}
.contato h2{color:var(--on)}
.contato-grade{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
@media (max-width:820px){.contato-grade{grid-template-columns:1fr}}
.c-card{border-radius:var(--r-lg);padding:28px;border:3px solid var(--branco);display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-width:0;transition:transform .3s var(--mola)}
.c-card:hover{transform:translateY(-6px) rotate(-.5deg)}
.c-whats{background:var(--whats);color:var(--ink)}
.c-insta{background:var(--rosa);color:var(--on)}
.c-card h3{font-size:28px}
.c-tel{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5vw,48px);line-height:1;font-variant-numeric:tabular-nums;user-select:all}
.c-linha{display:flex;flex-wrap:wrap;gap:12px}
.c-card .c-ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--branco);color:var(--ink);border:3px solid var(--ink)}
.c-card .c-ic .svg-i{width:30px;height:30px}
.c-nota{font-size:15px;font-weight:700;opacity:.9}
.rodape{margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.2);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:14px;color:#C9D6F2}

/* barra do pedido */
.barra-pedido{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;transform:translate(-50%,160%);transition:transform .45s var(--mola);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 20px;border-radius:var(--r-pill);background:var(--ink);color:var(--on);border:3px solid var(--branco);box-shadow:var(--flutuar);width:max-content;max-width:calc(100% - 32px)}
.barra-pedido.ativa{transform:translate(-50%,0)}
.barra-pedido span{font-weight:800;font-size:15px;min-width:0}
.barra-pedido b{color:var(--amarelo);font-variant-numeric:tabular-nums}

/* toast */
.toast{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));left:50%;z-index:60;transform:translate(-50%,-30px) scale(.9);opacity:0;transition:transform .35s var(--mola),opacity .25s;background:var(--amarelo);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--relevo-sm);border-radius:var(--r-pill);padding:10px 20px;font-weight:800;font-size:15px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.mostra{opacity:1;transform:translate(-50%,0) scale(1)}

/* diálogos */
dialog{border:0;padding:0;color:var(--ink);background:var(--papel);max-width:calc(100% - 24px)}
dialog::backdrop{background:var(--veu);backdrop-filter:blur(3px)}
.modal{width:640px;border-radius:var(--r-lg);border:3px solid var(--ink);box-shadow:0 12px 0 var(--ink);overflow:hidden;max-height:calc(100% - 32px)}
.modal[open]{animation:abre .45s var(--mola)}
@keyframes abre{from{transform:scale(.85) translateY(30px);opacity:0}}
.modal-inner{max-height:calc(100dvh - 40px);overflow-y:auto}
.modal .card-foto{aspect-ratio:16/9}
.modal-corpo{padding:22px 26px 28px;display:flex;flex-direction:column;gap:14px}
.modal-corpo h3{font-size:34px}
.modal-corpo .desc{font-size:17px;line-height:1.6;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13.5px;font-weight:800;padding:4px 12px;border-radius:var(--r-pill);background:var(--azul-soft);color:var(--azul)}
.fechar{position:absolute;top:12px;right:12px;z-index:3;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--branco);display:grid;place-items:center;cursor:pointer;box-shadow:var(--relevo-sm);transition:transform .2s var(--mola)}
.fechar:hover{transform:rotate(90deg)}
.gaveta{margin:0 0 0 auto;height:100%;max-height:100%;width:460px;border-left:3px solid var(--ink)}
.gaveta[open]{animation:desliza .45s var(--mola)}
@keyframes desliza{from{transform:translateX(100%)}}
.gaveta-inner{display:flex;flex-direction:column;height:100%}
.gaveta-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 16px;border-bottom:2px solid var(--linha)}
.gaveta-cab h2{font-size:28px}
.gaveta-cab .fechar{position:static}
.gaveta-corpo{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.gaveta-pe{padding:16px 22px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--linha);display:flex;flex-direction:column;gap:10px;background:var(--branco)}
.gaveta-pe .btn{width:100%}
.lista-escolhidos{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.lista-escolhidos li{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r-md);background:var(--branco);border:2px solid var(--linha);animation:surge .35s var(--mola)}
.lista-escolhidos img,.lista-escolhidos .mini-sem{width:64px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--ceu)}
.lista-escolhidos strong{flex:1;font-family:var(--f-display);font-weight:600;font-size:18px;min-width:0}
.remover{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--branco);cursor:pointer;display:grid;place-items:center;flex:none;transition:transform .2s var(--mola),background-color .2s}
.remover:hover{background:var(--vermelho-soft);transform:scale(1.1)}
.remover .svg-i{width:18px;height:18px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-weight:800;font-size:14px}
.campo input,.campo select,.campo textarea{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--branco);border:2px solid var(--linha);border-radius:12px;padding:10px 12px;transition:border-color .2s,box-shadow .2s;width:100%}
.campo textarea{min-height:76px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-soft)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.dupla{grid-template-columns:1fr}}
.nota{font-size:13.5px;color:var(--ink-suave);font-weight:600}
.titulo-bloco{font-family:var(--f-faixa);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em}

/* administração */
.aviso-admin{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:10px 20px;background:var(--amarelo);border-bottom:2px solid var(--ink);font-weight:800;font-size:15px;text-align:center}
.adm-linha{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r-md);background:var(--branco);border:2px solid var(--linha)}
.adm-linha img,.adm-linha .mini-sem{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--ceu)}
.adm-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.adm-info strong{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.15}
.adm-toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{height:30px;padding:0 10px;border-radius:var(--r-pill);border:2px solid var(--ink);background:var(--branco);font-size:12.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background-color .2s,color .2s,transform .2s var(--mola)}
.tg:hover{transform:translateY(-1px)}
.tg[aria-pressed="true"].tg-vitrine{background:var(--azul);color:var(--on)}
.tg[aria-pressed="true"].tg-alugado{background:var(--ink);color:var(--amarelo)}
.adm-btns{display:flex;flex-direction:column;gap:6px}
.icone-btn{width:36px;height:36px;border-radius:10px;border:2px solid var(--ink);background:var(--branco);display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--mola)}
.icone-btn:hover{transform:scale(1.1)}
.icone-btn .svg-i{width:18px;height:18px}
.confirma{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--vermelho-soft);font-weight:800;font-size:14px}
.editor{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-md);background:var(--branco);border:3px solid var(--azul);animation:surge .35s var(--mola)}
.foto-edit{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.foto-edit .prev{width:120px;height:84px;border-radius:12px;overflow:hidden;background:var(--ceu);flex:none}
.foto-edit .prev img{width:100%;height:100%;object-fit:cover;display:block}
.checks{display:flex;flex-wrap:wrap;gap:16px;font-weight:800;font-size:15px}
.checks label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--azul)}
.status-pub{font-size:14px;font-weight:800;min-height:20px}

function mensagem(){
  var nomes=escolhidos.map(function(id){var b=porId(id);return b?'• '+b.nome:null}).filter(Boolean);
  var t='Olá, M&M Brinquedos! Vim pelo site e gostaria de um orçamento.';
  if(nomes.length)t+='\n\nBrinquedos escolhidos:\n'+nomes.join('\n');
  var campos=[['Nome','f-nome'],['Data do evento','f-data'],['Horário do agendamento','f-hora'],['Tipo de evento','f-tipo'],['Endereço','f-endereco'],['Observações','f-obs']], ex=[];
  campos.forEach(function(c){var el=document.getElementById(c[1]);var v=el?el.value.trim():'';if(v){if(c[1]==='f-data'){var p=v.split('-');if(p.length===3)v=p[2]+'/'+p[1]+'/'+p[0]}ex.push(c[0]+': '+v)}});
  if(ex.length)t+='\n\n'+ex.join('\n');
  return t;
}
function linkWhats(txt){return 'https://wa.me/'+digitos()+(txt?'?text='+encodeURIComponent(txt):'')}
function renderPedido(){
  var n=escolhidos.length, cont=$('#contador');
  if(cont.textContent!==String(n)){cont.textContent=n;cont.classList.remove('pula');void cont.offsetWidth;cont.classList.add('pula')}
  $('#barra-n').textContent=n; $('#barra-txt').textContent=n===1?'brinquedo escolhido':'brinquedos escolhidos';
  $('#barra-pedido').classList.toggle('ativa',n>0&&!$('#gaveta-pedido').open);
  $('#pedido-lista').innerHTML=n?'<ul class="lista-escolhidos">'+escolhidos.map(function(id){var b=porId(id);if(!b)return '';return '<li>'+(b.foto?'<img src="'+b.foto+'" alt="">':'<span class="mini-sem"></span>')+'<strong>'+esc(b.nome)+'</strong><button class="remover" type="button" data-remover="'+b.id+'" aria-label="Remover '+esc(b.nome)+'">'+ic('x')+'</button></li>'}).join('')+'</ul>'
    :'<p class="vazio">Nenhum brinquedo escolhido ainda. Você pode enviar a mensagem assim mesmo ou voltar à vitrine para escolher.</p>';
  atualizarEnvio();
}
function atualizarEnvio(){$('#enviar-whats').href=linkWhats(mensagem())}

function alternar(id,btn){
  var b=porId(id); if(!b||b.alugado)return;
  var i=escolhidos.indexOf(id);
  if(i>-1){escolhidos.splice(i,1);toast(b.nome+' saiu do pedido')}else{escolhidos.push(id);toast(b.nome+' entrou no seu pedido!')}
  salvarPedido(); atualizarBotoes(); renderPedido();
  if(btn){btn.classList.remove('pop');void btn.offsetWidth;btn.classList.add('pop')}
  var mi=$('#modal-info'); if(mi.open)abrirInfo(id,true);
}

function copiar(texto,btn){
  var ok=function(){var s=btn.querySelector('span');var o=s.textContent;s.textContent='Copiado!';setTimeout(function(){s.textContent=o},1600)};
  try{navigator.clipboard.writeText(texto).then(ok,function(){selecionar()})}catch(e){selecionar()}
  function selecionar(){var r=document.createRange();r.selectNodeContents($('#tel-exibido'));var sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Número selecionado. Copie com Ctrl+C ou toque longo.')}
}

var publicando=false;
function publicar(){
  if(publicando)return; var st=$('#status-pub'), av=$('#aviso-txt');
  var use=window.claude&&window.claude.use;
  if(!use){st.textContent='A publicação só funciona dentro do Claude, na página publicada.';av.textContent=st.textContent;return}
  publicando=true; st.textContent='Publicando...'; av.textContent='Publicando...';
  window.claude.use('artifact').then(function(art){
    if(!art){throw {code:'not_granted'}}
    return art.publish(gerarPagina());
  }).then(function(){st.textContent='Publicado! A página vai recarregar com a nova vitrine.';av.textContent=st.textContent;sujo=false}).catch(function(e){
    publicando=false; var c=e&&e.code, m;
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared')m='Esta visualização é só de leitura. Abra o site pela sua conta, com permissão de edição, para publicar.';
    else if(c==='conflict')m='Outra versão foi publicada antes. A página vai recarregar; refaça as alterações.';
    else if(c==='too_large')m='O site ficou grande demais. Use fotos menores ou remova alguma.';
    else if(c==='rate_limited')m='Muitas publicações seguidas. Espere um minuto e tente de novo.';
    else m='Não foi possível publicar agora. Tente de novo em instantes.';
    st.textContent=m; av.textContent=m;
  });
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-escolher],[data-info],[data-remover],[data-filtro],[data-acao],[data-tg],[data-editar],[data-apagar],[data-confirmar]'); if(!t)return;
  if(t.hasAttribute('data-escolher'))return alternar(t.getAttribute('data-escolher'),t);
  if(t.hasAttribute('data-info'))return abrirInfo(t.getAttribute('data-info'));
  if(t.hasAttribute('data-remover'))return alternar(t.getAttribute('data-remover'));
  if(t.hasAttribute('data-filtro')){filtro=t.getAttribute('data-filtro');return renderCatalogo()}
  if(t.hasAttribute('data-tg')){var b=porId(t.getAttribute('data-id')),k=t.getAttribute('data-tg');b[k]=!b[k];marcarSujo();return renderAdmin()}
  if(t.hasAttribute('data-editar')){editando=editando===t.getAttribute('data-editar')?null:t.getAttribute('data-editar');confirmando=null;renderAdmin();var ed=$('#editor');if(ed)ed.scrollIntoView({block:'nearest'});return}
  if(t.hasAttribute('data-apagar')){confirmando=t.getAttribute('data-apagar');editando=null;return renderAdmin()}
  if(t.hasAttribute('data-confirmar')){var id=t.getAttribute('data-confirmar'),bb=porId(id);lista=lista.filter(function(x){return x.id!==id});confirmando=null;toast((bb?bb.nome:'Brinquedo')+' foi removido');marcarSujo();return renderAdmin()}
  var a=t.getAttribute('data-acao');
  if(a==='abrir-catalogo'){e.preventDefault();if(catalogoAberto&&t.id==='btn-ver-mais')return fecharCatalogo();return abrirCatalogo(true)}
  if(a==='fechar-catalogo')return fecharCatalogo();
  if(a==='pedido'){renderPedido();$('#gaveta-pedido').showModal();$('#barra-pedido').classList.remove('ativa');return}
  if(a==='fechar'){var d=t.closest('dialog');if(d)d.close();return}
  if(a==='copiar-tel')return copiar(String(cfg.whatsapp).replace(/\D/g,''),t);
  if(a==='admin'){renderAdmin();$('#gaveta-admin').showModal();return}
  if(a==='novo'){editando=editando==='novo'?null:'novo';confirmando=null;return renderAdmin()}
  if(a==='cancelar-edicao'){editando=null;return renderAdmin()}
  if(a==='cancelar-apagar'){confirmando=null;return renderAdmin()}
  if(a==='publicar')return publicar();
});

    parts.push({t:t,x:x,y:Math.random(),z:rnd(.25,1),s:(t==='bola'?rnd(9,22):rnd(6,12))*(centro?.7:1),c:COR[i%6],r:rnd(0,6.28),vr:rnd(-.02,.02),f:rnd(0,6.28),a:(centro?.22:.62)*(estreito?.6:1),sp:0});}
  var nuvens=[]; for(var k=0;k<5;k++)nuvens.push({x:Math.random(),y:rnd(.05,.95),z:rnd(.08,.22),s:rnd(.7,1.4),vx:rnd(.004,.012)});

  function mix(a,b,p){var A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);function ch(s){return Math.round(((A>>s)&255)*(1-p)+((B>>s)&255)*p)}return 'rgb('+ch(16)+','+ch(8)+','+ch(0)+')'}
  function ceu(p){

  function nuvem(n,sy,t){var L=H+400,x=((n.x+t*n.vx*.00002*60)%1.3)*W*1.3-W*.15,y=(((n.y*L-sy*n.z)%L)+L)%L-200,s=n.s*(W<600?.6:1);
